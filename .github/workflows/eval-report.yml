# Publish the committed eval report (evals/report.html) to GitHub Pages.
# Evals run locally (npm run eval); CI only publishes what was committed.
name: Eval report

on:
  push:
    branches: [main]
    paths: ['evals/report.html']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - run: mkdir -p site && cp evals/report.html site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
